{% load static %}
<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
    <div class="container">
        <a class="navbar-brand text-success fw-bold" href="{% url 'greenhouse:dashboard' %}">🏭 Тепличное хозяйство</a>

        <div class="navbar-nav ms-auto">
            <a class="nav-link text-dark" href="{% url 'greenhouse:greenhouse_list' %}">Теплицы</a>
            <a class="nav-link text-dark" href="{% url 'greenhouse:planting_list' %}">Посадки</a>
            <a class="nav-link text-dark" href="{% url 'greenhouse:workschedule_list' %}">Работы</a>
            <a class="nav-link text-dark" href="{% url 'greenhouse:reports' %}">Отчеты</a>
            <a class="nav-link text-dark" href="/admin/">Админка</a>

            {% if user.is_authenticated %}
              <div class="btn-group" role="group" aria-label="Basic outlined example">
                <a class="btn btn-success text-decoration-none text-white"
                    href="{% url 'user:profile' user.username %}">{{ user.username }}</a>
                <form method="post" action="{% url 'logout' %}" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-success text-decoration-none text-success">
                        Выйти
                    </button>
                </form>
              </div>
            {% else %}
              <div class="btn-group" role="group" aria-label="Basic outlined example">
                <a class="btn btn-success text-decoration-none text-white"
                    href="{% url 'login' %}">Войти</a>
                <a class="btn btn-outline-success text-decoration-none text-success"
                    href="{% url 'registration' %}">Регистрация</a>
              </div>
            {% endif %}
        </div>
    </div>
</nav>
